<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — HUMI Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
    <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur supports-[backdrop-filter]:bg-white/80">
        <nav class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8">
            <ul class="flex flex-wrap items-center justify-center gap-6 py-4 text-sm font-medium sm:justify-between sm:gap-8">
                <li class="hidden sm:block">
                    <a href="index.html" class="text-slate-600 hover:text-slate-900 transition-colors">HUMI Lab</a>
                </li>
                <li class="flex flex-wrap items-center justify-center gap-4 sm:gap-6">
                    <a href="index.html" class="text-slate-600 hover:text-slate-900 transition-colors">Home</a>
                    <a href="research.html" class="text-slate-600 hover:text-slate-900 transition-colors">Research</a>
                    <a href="people.html" class="text-slate-600 hover:text-slate-900 transition-colors">People</a>
                    <a href="publications.html" class="text-slate-600 hover:text-slate-900 transition-colors">Publications</a>
                    <a href="news.html" class="text-slate-600 hover:text-slate-900 transition-colors">News</a>
                    <a href="contact.html" class="text-slate-900 font-semibold">Contact</a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="mx-auto max-w-5xl px-4 py-16 sm:px-6 sm:py-24 lg:px-8">
        <section>
            <h1 class="text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl">
                Contact
            </h1>
            <p class="mt-6 max-w-2xl text-lg leading-relaxed text-slate-600">
                Get in touch with HUMI Lab. We welcome collaboration, student inquiries, and general questions.
            </p>
            <div class="mt-8">
                <h2 class="text-2xl font-semibold text-slate-900 mb-6">Send us a message</h2>
                <div id="form-message" class="mb-6 hidden p-4 rounded-lg"></div>
                <form id="contact-form" class="space-y-6 max-w-2xl">
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-700 mb-2">Name</label>
                        <input type="text" id="name" name="name" required 
                               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none transition-colors">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Email</label>
                        <input type="email" id="email" name="email" required 
                               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none transition-colors">
                    </div>
                    <div>
                        <label for="subject" class="block text-sm font-medium text-slate-700 mb-2">Subject</label>
                        <input type="text" id="subject" name="subject" required 
                               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none transition-colors">
                    </div>
                    <div>
                        <label for="message" class="block text-sm font-medium text-slate-700 mb-2">Message</label>
                        <textarea id="message" name="message" rows="6" required 
                                  class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none transition-colors resize-vertical"></textarea>
                    </div>
                    <div>
                        <button type="submit" id="submit-btn"
                                class="px-6 py-3 bg-slate-900 text-white font-medium rounded-lg hover:bg-slate-800 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed">
                            Send Message
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script>
        // Replace this URL with your Google Apps Script web app URL
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJxEvS4yxZIAonzusht42ZWksqL-IRRm5yU_Wfx3u9fopNwBH3OrwUEJH76wurBpK5/exec';
        
        document.getElementById('contact-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const messageDiv = document.getElementById('form-message');
            const form = this;
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            
            // Hide previous messages
            messageDiv.classList.add('hidden');
            
            // Get form data
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };
            
            try {
                // Convert form data to URL-encoded format (avoids CORS preflight)
                const urlEncodedData = new URLSearchParams();
                urlEncodedData.append('name', formData.name);
                urlEncodedData.append('email', formData.email);
                urlEncodedData.append('subject', formData.subject);
                urlEncodedData.append('message', formData.message);
                
                // Send data to Google Apps Script using form-encoded data
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Required for Google Apps Script
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: urlEncodedData.toString()
                });
                
                // With no-cors mode, we can't read the response, so show success optimistically
                // The form will still submit successfully
                messageDiv.className = 'mb-6 p-4 rounded-lg bg-green-100 text-green-800 border border-green-300';
                messageDiv.textContent = 'Thank you! Your message has been sent successfully.';
                messageDiv.classList.remove('hidden');
                
                // Reset form
                form.reset();
                
            } catch (error) {
                // Show error message
                messageDiv.className = 'mb-6 p-4 rounded-lg bg-red-100 text-red-800 border border-red-300';
                messageDiv.textContent = 'Sorry, there was an error sending your message. Please try again or email us directly at stefanola@ru.is';
                messageDiv.classList.remove('hidden');
                
                console.error('Error sending form:', error);
            } finally {
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Message';
            }
        });
    </script>
</body>
</html>
